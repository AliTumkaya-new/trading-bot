name: Trading Bot — Hızlı Monitör

on:
  schedule:
    # Her 30 dakikada pozisyon kontrolü (UTC)
    - cron: '*/30 * * * *'
  workflow_dispatch:  # Manuel tetikleme

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  position-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: trading_system_v1/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r trading_system_v1/requirements.txt

      - name: Run position monitor
        working-directory: trading_system_v1/src
        env:
          PYTHONUNBUFFERED: '1'
          TZ: Europe/Istanbul
        run: |
          python -c "
          import sys, traceback
          sys.path.insert(0, '.')
          try:
              from main import run_monitor
              run_monitor()
          except Exception as e:
              traceback.print_exc()
              sys.exit(1)
          "

      - name: Save DB to repo
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@trading.local"
          git add -f trading_system_v1/data/trades.db
          if git diff --cached --quiet; then
            echo "No DB changes to commit"
          else
            git commit -m "monitor: position check $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              git pull --rebase --strategy-option=ours origin main && git push origin main && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi
